    <!-- Suppress harmless Vite HMR WebSocket disconnect errors in proxy/iframe environment -->
    <script>
      (function() {
        // 1. Filter out Vite HMR WebSocket errors from console.error to avoid false-positive error reporter triggers
        const origConsoleError = console.error;
        console.error = function(...args) {
          try {
            const first = args[0];
            const str = typeof first === 'string' ? first : (first && (first.message || first.stack)) ? String(first.message || first.stack) : String(first || '');
            if (
              str.includes('WebSocket closed without opened') ||
              (str.includes('[vite]') && str.includes('WebSocket')) ||
              str.includes('@vite/client')
            ) {
              return;
            }
          } catch (_) {}
          return origConsoleError.apply(console, args);
        };

        // 2. Intercept window.WebSocket for Vite HMR subprotocol to keep it cleanly in open state
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (urlStr.includes('/@vite') || (urlStr.includes(window.location.host) && !urlStr.includes('binance')));

            if (isViteHmr) {
              const target = new EventTarget();
              const dummyWs = {
                url: urlStr,
                readyState: 1, // OPEN
                protocol: 'vite-hmr',
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                send: function() {},
                close: function() {
                  dummyWs.readyState = 3; // CLOSED
                },
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };

              // Immediately signal successful open on microtask so @vite/client sets hasLoaded = true
              queueMicrotask(() => {
                const openEvent = new Event('open');
                dummyWs.dispatchEvent(openEvent);
                if (typeof dummyWs.onopen === 'function') {
                  dummyWs.onopen(openEvent);
                }
              });

              return dummyWs;
            }

            return new NativeWebSocket(url, protocols);
          };

          // Retain native WebSocket static constants and prototype
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        // 3. Prevent unhandled error / rejection bubbling for Vite WebSocket notices
        const isViteWsError = (err) => {
          if (!err) return false;
          const msg = typeof err === 'string' ? err : err.message || err.reason || '';
          return (
            msg.includes('WebSocket closed without opened') ||
            msg.includes('@vite/client') ||
            (msg.includes('[vite]') && msg.includes('WebSocket'))
          );
        };

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || isViteWsError(event.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
